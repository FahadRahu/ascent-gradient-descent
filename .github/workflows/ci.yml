name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, m0-foundation, 'm1*']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Production operations tests
        run: npm run test:ops
      - name: Coverage
        run: npm run coverage
      - name: Build
        run: npm run build
      - name: Bundle budget
        run: npm run check:bundle
      - name: Install browser engines
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Browser and accessibility tests
        run: npm run test:e2e
      - name: Mobile slow-4G readiness SLO
        run: npm run test:performance
