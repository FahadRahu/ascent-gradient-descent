name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, m0-foundation, 'm1*']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Keep this image version aligned with @playwright/test in package-lock.json.
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      options: --ipc=host
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Production operations tests
        run: npm run test:ops
      - name: Coverage
        run: npm run coverage
      - name: Build
        run: npm run build
      - name: Bundle budget
        run: npm run check:bundle
      - name: Browser and accessibility tests
        run: npm run test:e2e
      - name: Mobile slow-4G readiness SLO
        run: npm run test:performance
      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
